# Railway config for the web service (the React/Vite frontend).
#
# The repo-root railway.toml belongs to the API service. In the web service's
# Settings, set "Config file path" to /apps/web/railway.toml and leave the root
# directory at the repo root, so pnpm sees the workspace and lockfile.
#
# VITE_* variables (VITE_API_URL, VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
# VITE_MAPTILER_KEY, VITE_SENTRY_DSN) are baked in at build time, so they must be
# set on this service before the build runs.

[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @huntstack/web build"
# Only redeploy the web service when the frontend (or the lockfile) changes
watchPatterns = ["apps/web/**", "pnpm-lock.yaml", "package.json", "pnpm-workspace.yaml"]

[deploy]
# `serve -s dist` (apps/web package.json "start"): static files with SPA fallback to
# index.html, on 0.0.0.0 and the port in Railway's PORT variable (serve reads it itself)
startCommand = "pnpm --filter @huntstack/web start"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
