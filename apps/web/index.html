<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HuntStack - Plan your hunt</title>
    <meta
      name="description"
      content="Plan your waterfowl hunt in the Central and Mississippi flyways: season dates and bag limits, refuge and survey counts, and hunt-day weather, with an AI assistant that answers from them."
    />
    <link rel="canonical" href="https://huntstack.net/" />

    <!-- Open Graph (Facebook, iMessage, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HuntStack" />
    <meta property="og:url" content="https://huntstack.net/" />
    <meta property="og:title" content="HuntStack - Plan your hunt" />
    <meta
      property="og:description"
      content="Plan your waterfowl hunt in the Central and Mississippi flyways: season dates and bag limits, refuge and survey counts, and hunt-day weather, with an AI assistant that answers from them."
    />
    <meta property="og:image" content="https://huntstack.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HuntStack - waterfowl hunt planning for the Central and Mississippi flyways" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HuntStack - Plan your hunt" />
    <meta
      name="twitter:description"
      content="Plan your waterfowl hunt in the Central and Mississippi flyways: season dates and bag limits, refuge and survey counts, and hunt-day weather, with an AI assistant that answers from them."
    />
    <meta name="twitter:image" content="https://huntstack.net/og-image.png" />

    <meta name="theme-color" content="#111315" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
    />

    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('huntstack-theme') || '{}');
          var theme = (stored.state && stored.state.theme) || 'system';
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
