<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HuntStack - Pre-hunt intelligence for waterfowl hunters</title>
    <meta
      name="description"
      content="Live refuge counts, migration timing, and structured state regulations for the Central and Mississippi flyways - searchable in one place."
    />
    <link rel="canonical" href="https://huntstack.com/" />

    <!-- Open Graph (Facebook, iMessage, Slack, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HuntStack" />
    <meta property="og:url" content="https://huntstack.com/" />
    <meta property="og:title" content="HuntStack - Pre-hunt intelligence for waterfowl hunters" />
    <meta
      property="og:description"
      content="Live refuge counts, migration timing, and structured state regulations for the Central and Mississippi flyways - searchable in one place."
    />
    <meta property="og:image" content="https://huntstack.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="HuntStack - pre-hunt intelligence for the Central and Mississippi flyways" />

    <!-- Twitter/X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HuntStack - Pre-hunt intelligence for waterfowl hunters" />
    <meta
      name="twitter:description"
      content="Live refuge counts, migration timing, and structured state regulations for the Central and Mississippi flyways - searchable in one place."
    />
    <meta name="twitter:image" content="https://huntstack.com/og-image.png" />

    <meta name="theme-color" content="#0d1117" />

    <script>
      (function() {
        try {
          var stored = JSON.parse(localStorage.getItem('huntstack-theme') || '{}');
          var theme = (stored.state && stored.state.theme) || 'system';
          var dark = theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
