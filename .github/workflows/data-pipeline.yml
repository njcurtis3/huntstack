name: Data pipeline

# The weekly data run: every pipeline job that's due (refuge and state survey counts in season,
# regulation pages monthly). Replaces the Windows Task Scheduler run of
# scripts/run-refuge-counts.ps1. Runs are recorded in pipeline_runs, so a job that already ran
# this week (from here or a PC) is skipped.
#
# Secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL           required: the Supabase pooler URL from .env
#   LLM_API_KEY            required: reads LDWF's PDFs (OpenRouter key from .env)
#   SCRAPER_ALERT_WEBHOOK  optional: Slack/Discord webhook for warnings and failures
# A failed job fails this workflow, and GitHub emails the owner about it.

on:
  schedule:
    - cron: '0 12 * * 1'   # Mondays 12:00 UTC = 6am Central (7am during daylight time)
  workflow_dispatch:
    inputs:
      targets:
        description: '"all" for every due job, or job names / globs such as "counts:*"'
        default: all
      force:
        description: 'With "all": run every job, due or not'
        type: boolean
        default: false
      dry_run:
        description: 'Parse only: write nothing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  update:
    name: Update data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/scrapers-python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/scrapers-python/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          missing=""
          [ -n "$DATABASE_URL" ] || missing="$missing DATABASE_URL"
          [ -n "$LLM_API_KEY" ] || missing="$missing LLM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          # Only the Hagerman census job needs it (it reads eBird checklists); that job fails without it
          [ -n "$EBIRD_API_KEY" ] || echo "::warning::EBIRD_API_KEY secret not set: the Hagerman NWR census job will fail"

      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: https://openrouter.ai/api/v1
          LLM_MODEL: meta-llama/llama-3.3-70b-instruct
          SCRAPER_ALERT_WEBHOOK: ${{ secrets.SCRAPER_ALERT_WEBHOOK }}
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
          TARGETS: ${{ github.event.inputs.targets || 'all' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '--force' || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          PYTHONUNBUFFERED: '1'
        # TARGETS stays unquoted so several names split into separate arguments; set -f keeps
        # the shell from expanding "counts:*" against files
        run: |
          set -f
          python -m huntstack_scrapers.pipeline update $TARGETS $FORCE $DRY_RUN

      - name: Status summary
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          {
            echo '### Data pipeline status'
            echo '```'
            python -m huntstack_scrapers.pipeline status 2>/dev/null || echo 'status unavailable'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
